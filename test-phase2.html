<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Phase 2 API Tests</title>
        <style>
            body {
                font-family: system-ui, -apple-system, sans-serif;
                max-width: 1200px;
                margin: 40px auto;
                padding: 0 20px;
                line-height: 1.6;
            }
            h1 {
                color: #e63946;
            }
            .test-section {
                margin: 30px 0;
                padding: 20px;
                border: 2px solid #ddd;
                border-radius: 8px;
                background: #f8f9fa;
            }
            button {
                background: #e63946;
                color: white;
                border: none;
                padding: 10px 20px;
                margin: 5px;
                border-radius: 4px;
                cursor: pointer;
                font-size: 14px;
            }
            button:hover {
                background: #d62839;
            }
            pre {
                background: #2d3748;
                color: #fff;
                padding: 15px;
                border-radius: 4px;
                overflow-x: auto;
            }
            .success {
                color: #28a745;
                font-weight: bold;
            }
            .error {
                color: #dc3545;
                font-weight: bold;
            }
        </style>
    </head>
    <body>
        <h1>🧪 Phase 2: API Integration Tests</h1>
        <p>
            This page tests the PokeAPI service module and utility functions. Open the browser
            console (F12) to see detailed results.
        </p>

        <div class="test-section">
            <h2>API Service Tests</h2>
            <button onclick="testFetchList()">Test: Fetch Pokemon List</button>
            <button onclick="testFetchById()">Test: Fetch Pokemon by ID (Bulbasaur)</button>
            <button onclick="testFetchByName()">Test: Fetch Pokemon by Name (Pikachu)</button>
            <button onclick="testFetchSpecies()">Test: Fetch Pokemon Species</button>
            <button onclick="testNotFound()">Test: 404 Error Handling</button>
            <div id="api-results"></div>
        </div>

        <div class="test-section">
            <h2>Utility Function Tests</h2>
            <button onclick="testUtilities()">Test All Utility Functions</button>
            <div id="util-results"></div>
        </div>

        <div class="test-section">
            <h2>Complete Integration Test</h2>
            <button onclick="testCompleteFlow()">Test: Fetch & Transform Pokemon Data</button>
            <div id="integration-results"></div>
        </div>

        <script type="module">
            import {
                fetchPokemonList,
                fetchPokemonDetails,
                fetchPokemonSpecies,
            } from "./src/services/pokeapi.ts";
            import {
                convertHeight,
                convertWeight,
                cleanDescription,
                getEnglishDescription,
            } from "./src/utils/pokemon.ts";

            // Make functions available globally for button onclick
            window.testFetchList = async () => {
                const resultsDiv = document.getElementById("api-results");
                resultsDiv.innerHTML = "<p>Testing...</p>";
                console.log("=== Test: Fetch Pokemon List ===");

                try {
                    const result = await fetchPokemonList(0, 20);
                    console.log("Success!", result);
                    resultsDiv.innerHTML = `
                        <p class="success">✓ Success!</p>
                        <pre>${JSON.stringify(result, null, 2)}</pre>
                    `;
                } catch (error) {
                    console.error("Failed:", error);
                    resultsDiv.innerHTML = `
                        <p class="error">✗ Failed: ${error.message}</p>
                    `;
                }
            };

            window.testFetchById = async () => {
                const resultsDiv = document.getElementById("api-results");
                resultsDiv.innerHTML = "<p>Testing...</p>";
                console.log("=== Test: Fetch Pokemon by ID ===");

                try {
                    const pokemon = await fetchPokemonDetails(1);
                    console.log("Success!", pokemon);
                    resultsDiv.innerHTML = `
                        <p class="success">✓ Success! Fetched ${pokemon.name}</p>
                        <pre>${JSON.stringify(
                            {
                                id: pokemon.id,
                                name: pokemon.name,
                                height: pokemon.height,
                                weight: pokemon.weight,
                                types: pokemon.types.map((t) => t.type.name),
                            },
                            null,
                            2
                        )}</pre>
                    `;
                } catch (error) {
                    console.error("Failed:", error);
                    resultsDiv.innerHTML = `
                        <p class="error">✗ Failed: ${error.message}</p>
                    `;
                }
            };

            window.testFetchByName = async () => {
                const resultsDiv = document.getElementById("api-results");
                resultsDiv.innerHTML = "<p>Testing...</p>";
                console.log("=== Test: Fetch Pokemon by Name ===");

                try {
                    const pokemon = await fetchPokemonDetails("pikachu");
                    console.log("Success!", pokemon);
                    resultsDiv.innerHTML = `
                        <p class="success">✓ Success! Fetched ${pokemon.name}</p>
                        <pre>${JSON.stringify(
                            {
                                id: pokemon.id,
                                name: pokemon.name,
                                height: pokemon.height,
                                weight: pokemon.weight,
                            },
                            null,
                            2
                        )}</pre>
                    `;
                } catch (error) {
                    console.error("Failed:", error);
                    resultsDiv.innerHTML = `
                        <p class="error">✗ Failed: ${error.message}</p>
                    `;
                }
            };

            window.testFetchSpecies = async () => {
                const resultsDiv = document.getElementById("api-results");
                resultsDiv.innerHTML = "<p>Testing...</p>";
                console.log("=== Test: Fetch Pokemon Species ===");

                try {
                    const species = await fetchPokemonSpecies(1);
                    console.log("Success!", species);
                    resultsDiv.innerHTML = `
                        <p class="success">✓ Success!</p>
                        <pre>${JSON.stringify(
                            {
                                id: species.id,
                                name: species.name,
                                flavor_text_count: species.flavor_text_entries.length,
                                sample: species.flavor_text_entries[0],
                            },
                            null,
                            2
                        )}</pre>
                    `;
                } catch (error) {
                    console.error("Failed:", error);
                    resultsDiv.innerHTML = `
                        <p class="error">✗ Failed: ${error.message}</p>
                    `;
                }
            };

            window.testNotFound = async () => {
                const resultsDiv = document.getElementById("api-results");
                resultsDiv.innerHTML = "<p>Testing...</p>";
                console.log("=== Test: 404 Error Handling ===");

                try {
                    await fetchPokemonDetails("nonexistentpokemon99999");
                    resultsDiv.innerHTML = `
                        <p class="error">✗ Should have thrown an error!</p>
                    `;
                } catch (error) {
                    console.log("Correctly caught error:", error);
                    if (error.message === "No Pokémon found") {
                        resultsDiv.innerHTML = `
                            <p class="success">✓ Success! Correctly caught 404 error</p>
                            <pre>Error message: "${error.message}"</pre>
                        `;
                    } else {
                        resultsDiv.innerHTML = `
                            <p class="error">✗ Wrong error: ${error.message}</p>
                        `;
                    }
                }
            };

            window.testUtilities = () => {
                const resultsDiv = document.getElementById("util-results");
                console.log("=== Test: Utility Functions ===");

                const tests = {
                    heightConversion: convertHeight(7) === 0.7,
                    weightConversion: convertWeight(69) === 6.9,
                    cleanDescription: cleanDescription("Line1\fLine2") === "Line1 Line2",
                };

                const allPassed = Object.values(tests).every((t) => t);

                resultsDiv.innerHTML = `
                    <p class="${allPassed ? "success" : "error"}">
                        ${allPassed ? "✓ All tests passed!" : "✗ Some tests failed"}
                    </p>
                    <pre>${JSON.stringify(
                        {
                            heightConversion: {
                                input: "7 decimeters",
                                output: convertHeight(7) + " meters",
                                passed: tests.heightConversion,
                            },
                            weightConversion: {
                                input: "69 hectograms",
                                output: convertWeight(69) + " kg",
                                passed: tests.weightConversion,
                            },
                            cleanDescription: {
                                input: "Line1\\fLine2",
                                output: cleanDescription("Line1\fLine2"),
                                passed: tests.cleanDescription,
                            },
                        },
                        null,
                        2
                    )}</pre>
                `;
            };

            window.testCompleteFlow = async () => {
                const resultsDiv = document.getElementById("integration-results");
                resultsDiv.innerHTML = "<p>Testing complete data flow...</p>";
                console.log("=== Test: Complete Integration ===");

                try {
                    // Fetch Pokemon details
                    const pokemon = await fetchPokemonDetails(1);
                    // Fetch species data
                    const species = await fetchPokemonSpecies(1);

                    // Transform data
                    const transformedData = {
                        id: pokemon.id,
                        name: pokemon.name,
                        height: convertHeight(pokemon.height),
                        weight: convertWeight(pokemon.weight),
                        types: pokemon.types.map((t) => t.type.name),
                        description: getEnglishDescription(species.flavor_text_entries),
                        stats: {
                            hp: pokemon.stats[0].base_stat,
                            attack: pokemon.stats[1].base_stat,
                            defense: pokemon.stats[2].base_stat,
                        },
                    };

                    console.log("Complete transformed data:", transformedData);
                    resultsDiv.innerHTML = `
                        <p class="success">✓ Success! Complete data flow working</p>
                        <p>This demonstrates the full integration of API calls and utility functions.</p>
                        <pre>${JSON.stringify(transformedData, null, 2)}</pre>
                    `;
                } catch (error) {
                    console.error("Failed:", error);
                    resultsDiv.innerHTML = `
                        <p class="error">✗ Failed: ${error.message}</p>
                    `;
                }
            };
        </script>
    </body>
</html>
