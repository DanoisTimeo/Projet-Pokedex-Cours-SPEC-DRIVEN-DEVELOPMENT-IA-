version: "3.8"

services:
    pokedex-dev:
        container_name: pokedex-frontend-dev
        build:
            context: .
            dockerfile: Dockerfile
            target: development
        ports:
            - "3000:3000"
        volumes:
            # Mount source code for hot reload
            - .:/app
            # Prevent node_modules from being overwritten
            - /app/node_modules
        environment:
            - NODE_ENV=development
        stdin_open: true
        tty: true

    pokedex-prod:
        container_name: pokedex-frontend-prod
        build:
            context: .
            dockerfile: Dockerfile
            target: production
        ports:
            - "8080:80"
        environment:
            - NODE_ENV=production
